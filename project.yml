name: ClaudeUsage
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
  minimumXcodeGenVersion: "2.45.4"
  xcodeVersion: "27.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: true
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0
targets:
  UsageCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/UsageCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fredrir.UsageCore
        PRODUCT_NAME: UsageCore
        GENERATE_INFOPLIST_FILE: true
  ClaudeUsage:
    type: application
    platform: macOS
    sources:
      - path: Sources/ClaudeUsage
    dependencies:
      - target: UsageCore
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fredrir.ClaudeUsage
        PRODUCT_NAME: ClaudeUsage
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Configuration/ClaudeUsage.release.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: true
